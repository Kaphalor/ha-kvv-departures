name: KVV Abfahrten
version: "1.0.0"
slug: kvv_departures
description: Live-Abfahrten inkl. Verspätung im Netz des Karlsruher Verkehrsverbunds (KVV)
url: https://github.com/Kaphalor/ha-kvv-departures
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
# Ingress: erscheint in der HA-Seitenleiste
ingress: true
ingress_port: 8099
panel_icon: mdi:tram
panel_title: KVV
# Direkter Port: für iframe-/Webseiten-Karten im Dashboard
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Weboberfläche und JSON-API (für Dashboard-Einbindung)
options:
  default_stop: "de:08212:3"
  limit: 10
  cache_seconds: 30
  walk_minutes: 0
  log_level: info
schema:
  default_stop: str
  limit: int(1,40)
  cache_seconds: int(5,300)
  walk_minutes: int(0,60)
  log_level: list(debug|info|warning|error)
